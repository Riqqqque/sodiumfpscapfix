plugins {
    id "net.neoforged.moddev"
}

base {
    archivesName = "${rootProject.property("archives_base_name")}-neoforge-${rootProject.property("minecraft_1211")}"
}

sourceSets {
    main {
        java.srcDir(rootProject.file("common-src/1.21.1/java"))
        resources {
            setSrcDirs([
                    file("src/main/resources"),
                    rootProject.file("common-src/1.21.1-neoforge/resources"),
                    rootProject.file("common-src/1.21.1/resources")
            ])
        }
    }

    legacySodium {
        java.srcDir(rootProject.file("common-src/1.21.1-neoforge/java"))
        compileClasspath += sourceSets.main.output + (sourceSets.main.compileClasspath - files(rootProject.file("deps/sodium-neoforge-1.21.1-0.8.12-alpha.4-mod.jar")))
    }
}

dependencies {
    compileOnly files(rootProject.file("deps/sodium-neoforge-1.21.1-0.8.12-alpha.4-mod.jar"))
    legacySodiumCompileOnly files(rootProject.file("deps/sodium-neoforge-1.21.1.jar"))
}

tasks.named("compileLegacySodiumJava") {
    dependsOn(tasks.named("compileJava"))
}

tasks.named("jar") {
    from(sourceSets.legacySodium.output)
}

tasks.named("sourcesJar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.legacySodium.allSource)
}

neoForge {
    version = rootProject.property("neoforge_1211")

    runs {
        client {
            client()
        }
    }

    mods {
        sodiumfpscapfix {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def props = [
            version          : project.version,
            minecraft_version: rootProject.property("minecraft_1211"),
            neoforge_version : rootProject.property("neoforge_1211")
    ]

    inputs.properties(props)

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(props)
    }
}
