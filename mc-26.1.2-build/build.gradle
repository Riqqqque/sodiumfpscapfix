plugins {
    id "base"
}

allprojects {
    version = rootProject.property("mod_version")
    group = rootProject.property("maven_group")

    repositories {
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }
}

subprojects {
    apply plugin: "java"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = "UTF-8"
    }
}

def modrinthUploadDir = layout.projectDirectory.dir("../modrinth-upload")

tasks.register("collectModrinthJars", Copy) {
    dependsOn(subprojects.collect { it.tasks.named("build") })

    from(subprojects.collect { it.layout.buildDirectory.dir("libs") }) {
        include "*.jar"
        exclude "*-sources.jar"
    }

    into(modrinthUploadDir)

    doFirst {
        delete(fileTree(modrinthUploadDir.asFile) {
            include "sodiumfpscapfix-fabric-26.1.2-*.jar"
            include "sodiumfpscapfix-neoforge-26.1.2-*.jar"
        })
    }
}

tasks.register("buildAll") {
    dependsOn(tasks.named("collectModrinthJars"))
}
