plugins {
    id "base"
}

allprojects {
    version = rootProject.property("mod_version")
    group = rootProject.property("maven_group")

    repositories {
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }
}

subprojects {
    apply plugin: "java"

    def javaVersion = name == "fabric-1.20.1" ? 17 : 21

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
        options.encoding = "UTF-8"
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file("LICENSE")) {
            rename { "LICENSE_sodiumfpscapfix" }
        }
    }
}

def modrinthUploadDir = layout.projectDirectory.dir("modrinth-upload")
def releaseVersion = project.version.toString()

tasks.register("collectModrinthJars", Copy) {
    dependsOn(subprojects.collect { it.tasks.named("build") })

    from(subprojects.collect { it.layout.buildDirectory.dir("libs") }) {
        include "*-${project.version}.jar"
        exclude "*-sources.jar"
    }

    into(modrinthUploadDir)

    doFirst {
        delete(fileTree(modrinthUploadDir.asFile) {
            include "sodiumfpscapfix-fabric-1.20.1-*.jar"
            include "sodiumfpscapfix-fabric-1.21.1-*.jar"
            include "sodiumfpscapfix-fabric-1.21.11-*.jar"
            include "sodiumfpscapfix-neoforge-1.21.1-*.jar"
            include "sodiumfpscapfix-neoforge-1.21.11-*.jar"
        })
    }
}

tasks.register("buildMinecraft2612", GradleBuild) {
    dir = file("mc-26.1.2-build")
    tasks = ["buildAll"]
}

tasks.register("buildMinecraft262", GradleBuild) {
    dir = file("mc-26.2-build")
    tasks = ["buildAll"]
}

def expectedReleaseJarNames = [
        "sodiumfpscapfix-fabric-1.20.1-${project.version}.jar",
        "sodiumfpscapfix-fabric-1.21.1-${project.version}.jar",
        "sodiumfpscapfix-fabric-1.21.11-${project.version}.jar",
        "sodiumfpscapfix-fabric-26.1.2-${project.version}.jar",
        "sodiumfpscapfix-fabric-26.2-${project.version}.jar",
        "sodiumfpscapfix-neoforge-1.21.1-${project.version}.jar",
        "sodiumfpscapfix-neoforge-1.21.11-${project.version}.jar",
        "sodiumfpscapfix-neoforge-26.1.2-${project.version}.jar",
        "sodiumfpscapfix-neoforge-26.2-${project.version}.jar"
]

tasks.register("verifyModrinthJars") {
    dependsOn(
            tasks.named("collectModrinthJars"),
            tasks.named("buildMinecraft2612"),
            tasks.named("buildMinecraft262")
    )

    doLast {
        def missingJars = expectedReleaseJarNames.findAll { !modrinthUploadDir.file(it).asFile.isFile() }

        if (!missingJars.isEmpty()) {
            throw new GradleException("Missing release jars: ${missingJars.join(', ')}")
        }

        def actualJarNames = fileTree(modrinthUploadDir.asFile) {
            include "*.jar"
        }.files.collect { it.name }.toSet()
        def unexpectedJars = actualJarNames - expectedReleaseJarNames.toSet()

        if (!unexpectedJars.isEmpty()) {
            throw new GradleException("Unexpected release jars: ${unexpectedJars.sort().join(', ')}")
        }

        expectedReleaseJarNames.each { jarName ->
            def jarFile = modrinthUploadDir.file(jarName).asFile
            def fabric = jarName.contains("-fabric-")
            def metadataPath = fabric ? "fabric.mod.json" : "META-INF/neoforge.mods.toml"
            def requiredEntries = [
                    "LICENSE_sodiumfpscapfix",
                    "assets/sodiumfpscapfix/icon.png",
                    "sodiumfpscapfix.mixins.json",
                    metadataPath
            ]

            new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
                def entries = java.util.Collections.list(archive.entries())
                def entryNames = entries.collect { it.name }
                def duplicateEntries = entryNames.groupBy { it }.findAll { name, matches -> matches.size() > 1 }.keySet()
                def unsafeEntries = entryNames.findAll { it.startsWith("/") || it == ".." || it.startsWith("../") || it.contains("/../") }
                def missingEntries = requiredEntries.findAll { archive.getEntry(it) == null }

                if (!duplicateEntries.isEmpty()) {
                    throw new GradleException("Duplicate entries in ${jarName}: ${duplicateEntries.sort().join(', ')}")
                }

                if (!unsafeEntries.isEmpty()) {
                    throw new GradleException("Unsafe entries in ${jarName}: ${unsafeEntries.sort().join(', ')}")
                }

                if (!missingEntries.isEmpty()) {
                    throw new GradleException("Missing entries in ${jarName}: ${missingEntries.join(', ')}")
                }

                def metadata = archive.getInputStream(archive.getEntry(metadataPath)).getText("UTF-8")
                def expectedVersion = fabric ? "\"version\": \"${releaseVersion}\"" : "version=\"${releaseVersion}\""

                if (!metadata.contains(expectedVersion)) {
                    throw new GradleException("Incorrect version metadata in ${jarName}")
                }
            }
        }
    }
}

tasks.register("buildAll") {
    dependsOn(tasks.named("verifyModrinthJars"))
}
